name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go: [ '1.24', 'stable' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v -race ./...

      - name: Verify Build
        run: go build -o bin/deck ./cmd/deck

  cross-compile:
    name: Multi-Arch Build Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Compile Linux (amd64, arm64, armv7)
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/deck
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/deck
          GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/deck

      - name: Compile macOS (Intel, Apple Silicon)
        run: |
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/deck
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/deck

      - name: Compile Windows (amd64, arm64)
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/deck
          GOOS=windows GOARCH=arm64 go build -o /dev/null ./cmd/deck
